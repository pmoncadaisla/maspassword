<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Login screen -->
  <div id="screen-login" class="screen active">
    <div class="login-hero">
      <div class="brand-mark">
        <svg viewBox="0 0 96 96" fill="currentColor" width="26" height="26" aria-hidden="true"><polygon points="8,2 42,14 42,82 8,94"/><polygon points="88,2 54,14 54,82 88,94"/></svg>
      </div>
      <h1>sésamo</h1>
      <p class="login-sub" data-i18n="login.sub"></p>
    </div>
    <div class="popup-body login-body">
      <div id="login-loading" class="login-loading"><div class="spinner"></div></div>
      <div id="sso-buttons"></div>
      <div class="auth-sep" id="login-sep" style="display:none"><span data-i18n="login.or"></span></div>
      <div id="srp-form" style="display:none">
        <div class="form-group">
          <label for="login-email" data-i18n="login.email"></label>
          <input type="email" id="login-email" autocomplete="username" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="login-password" data-i18n="login.master"></label>
          <input type="password" id="login-password">
        </div>
        <button class="btn btn-primary btn-block" id="btn-login" data-i18n="login.cta"></button>
      </div>
      <div id="login-error" class="error-msg"></div>
      <div id="setup-hint" style="display:none">
        <p class="hint" data-i18n="login.needsSetup"></p>
        <button class="btn btn-secondary btn-block" id="btn-open-web" data-i18n="login.openWeb"></button>
      </div>
      <details class="server-details">
        <summary data-i18n="login.server"></summary>
        <input type="url" id="server-url" placeholder="https://…" spellcheck="false">
        <p class="hint" data-i18n="login.serverHint"></p>
      </details>
    </div>
  </div>

  <!-- Unlock screen (after SSO: only the master password is missing) -->
  <div id="screen-unlock" class="screen">
    <div class="login-hero">
      <div class="brand-mark">
        <svg viewBox="0 0 96 96" fill="currentColor" width="26" height="26" aria-hidden="true"><polygon points="8,2 42,14 42,82 8,94"/><polygon points="88,2 54,14 54,82 88,94"/></svg>
      </div>
      <h1>sésamo</h1>
      <p class="login-sub" id="unlock-email"></p>
    </div>
    <div class="popup-body login-body">
      <div class="form-group">
        <label for="unlock-password" data-i18n="login.master"></label>
        <input type="password" id="unlock-password">
      </div>
      <button class="btn btn-primary btn-block" id="btn-unlock" data-i18n="unlock.cta"></button>
      <div id="unlock-error" class="error-msg"></div>
      <button class="btn-link" id="btn-unlock-back" data-i18n="unlock.back"></button>
    </div>
  </div>

  <!-- Main screen (logged in) -->
  <div id="screen-main" class="screen">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 96 96" fill="currentColor" width="16" height="16" aria-hidden="true"><polygon points="8,2 42,14 42,82 8,94"/><polygon points="88,2 54,14 54,82 88,94"/></svg>
        <span>sésamo</span>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="btn-refresh" data-i18n-title="main.refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="btn-icon" id="btn-logout" data-i18n-title="main.lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
      </div>
    </header>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" data-i18n-ph="main.search" autocomplete="off" spellcheck="false">
    </div>
    <div class="popup-body" id="items-container">
      <div id="current-site-section"></div>
      <div id="all-items-section"></div>
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <p data-i18n="main.empty"></p>
      </div>
    </div>
    <footer class="bottombar">
      <button class="footer-btn" id="btn-generate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 3v2"/><path d="M12 19v2"/><path d="m5.6 5.6 1.5 1.5"/><path d="m16.9 16.9 1.5 1.5"/><path d="M3 12h2"/><path d="M19 12h2"/><path d="m5.6 18.4 1.5-1.5"/><path d="m16.9 7.1 1.5-1.5"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-i18n="main.generator"></span>
      </button>
      <span class="version" id="version"></span>
    </footer>
  </div>

  <!-- Item detail screen (with TOTP) -->
  <div id="screen-detail" class="screen">
    <header class="topbar">
      <button class="btn-icon" id="btn-detail-back" data-i18n-title="detail.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2 id="detail-title" class="topbar-title">Item</h2>
      <span class="topbar-spacer"></span>
    </header>
    <div class="popup-body" id="detail-body"></div>
    <footer class="bottombar">
      <button class="btn btn-primary btn-block" id="btn-detail-fill" data-i18n="detail.fill"></button>
    </footer>
  </div>

  <!-- Password generator screen -->
  <div id="screen-generator" class="screen">
    <header class="topbar">
      <button class="btn-icon" id="btn-gen-back" data-i18n-title="detail.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2 class="topbar-title" data-i18n="gen.title"></h2>
      <span class="topbar-spacer"></span>
    </header>
    <div class="popup-body">
      <div class="gen-output-row">
        <div class="gen-password" id="gen-output"></div>
        <button class="btn-icon" id="btn-gen-refresh" data-i18n-title="gen.regenerate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>

      <div class="gen-control">
        <label><span data-i18n="gen.length"></span> <span class="gen-len-badge" id="gen-len-value">20</span></label>
        <input type="range" id="gen-length" min="8" max="40" value="20">
      </div>

      <div class="gen-toggles">
        <label class="gen-toggle"><input type="checkbox" id="gen-upper" checked> <span data-i18n="gen.upper"></span></label>
        <label class="gen-toggle"><input type="checkbox" id="gen-lower" checked> <span data-i18n="gen.lower"></span></label>
        <label class="gen-toggle"><input type="checkbox" id="gen-digits" checked> <span data-i18n="gen.digits"></span></label>
        <label class="gen-toggle"><input type="checkbox" id="gen-symbols" checked> <span data-i18n="gen.symbols"></span></label>
      </div>
    </div>
    <footer class="bottombar bottombar-split">
      <button class="btn btn-secondary" id="btn-gen-generate" data-i18n="gen.generate"></button>
      <button class="btn btn-primary" id="btn-gen-copy" data-i18n="gen.copy"></button>
    </footer>
  </div>

<script type="module" src="popup.js"></script>
</body>
</html>
