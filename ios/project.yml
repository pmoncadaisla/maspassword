# XcodeGen spec for the MasPassword iOS app + AutoFill extension.
#
#   brew install xcodegen        # on a Mac
#   cd ios && xcodegen generate  # produces MasPassword.xcodeproj
#
# The .xcodeproj is generated, never hand-edited or committed. Info.plists
# and .entitlements files are ALSO generated by XcodeGen from the
# `info:`/`entitlements:` properties below at `xcodegen generate` time.
#
# Signing: set DEVELOPMENT_TEAM below (or in Xcode's Signing pane after
# generating). The App Group `group.com.maspassword.shared` and the keychain
# sharing group must be enabled for BOTH bundle ids in your developer
# account — see ios/README.md "Signing, App Group & Keychain sharing".
#
# IMPORTANT: keep `com.maspassword.shared` as the FIRST entry of
# keychain-access-groups in both targets — the keychain code stores items in
# the default (first) group so app and extension read the same records
# without hardcoding the team-id prefix.

name: MasPassword

options:
  bundleIdPrefix: com.maspassword
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team id here (or select it in Xcode):
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.3.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_EMIT_LOC_STRINGS: false

packages:
  MasPasswordCore:
    path: MasPasswordCore

targets:
  MasPassword:
    type: application
    platform: iOS
    sources:
      - path: MasPassword/App
      - path: MasPassword/Shared
    dependencies:
      - package: MasPasswordCore
      - target: MasPasswordAutoFill
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maspassword.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    info:
      path: MasPassword/App/Info.plist
      properties:
        CFBundleDisplayName: MasPassword
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          MasPassword uses the camera only to scan the pairing QR code shown
          in your web vault. Images never leave the device.
        NSFaceIDUsageDescription: >-
          Face ID re-locks and re-opens the app while it stays running, so you
          don't have to retype your master password after switching apps.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MasPassword/App/MasPassword.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maspassword.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.maspassword.shared

  MasPasswordAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: MasPassword/AutoFill
      - path: MasPassword/Shared
    dependencies:
      - package: MasPasswordCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maspassword.ios.autofill
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    info:
      path: MasPassword/AutoFill/Info.plist
      properties:
        CFBundleDisplayName: MasPassword AutoFill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    entitlements:
      path: MasPassword/AutoFill/MasPasswordAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maspassword.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.maspassword.shared

schemes:
  MasPassword:
    build:
      targets:
        MasPassword: all
    run:
      config: Debug
    archive:
      config: Release
