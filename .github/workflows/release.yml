# Distributable builds: macOS desktop app (Tauri, universal), Chrome extension
# zip, and multi-arch Docker image (linux/amd64 + linux/arm64) on GHCR.
#
# - pull_request: builds everything and uploads workflow artifacts; publishes nothing.
# - push tag v*:  publishes a GitHub Release with binaries + SHA256SUMS, and pushes
#                 the image to ghcr.io with :<version> and :latest.
# - workflow_dispatch: like a branch push — artifacts + image tagged with branch/sha.
name: Release

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'web/**'
      - 'extension/**'
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (Go + web + extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/tests/*.test.js
      - run: node --test ./*.test.mjs
        working-directory: extension

  desktop-macos:
    name: Desktop app (macOS universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm ci
        working-directory: desktop
      # The icon set is generated (gitignored); tauri build fails without it.
      - name: Generate icons
        run: npm run icons
        working-directory: desktop
      - name: Build universal .app + .dmg
        run: npx tauri build --target universal-apple-darwin
        working-directory: desktop
      - name: Collect artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then VERSION="sha-${GITHUB_SHA::7}"; fi
          BUNDLE=desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist
          cp "${BUNDLE}"/dmg/*.dmg "dist/MasPassword-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent "${BUNDLE}/macos/MasPassword.app" \
            "dist/MasPassword-${VERSION}-macos-universal.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/*
          if-no-files-found: error

  extension:
    name: Chrome extension (zip)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then VERSION="sha-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          (cd extension && zip -r "../dist/maspassword-extension-${VERSION}.zip" . \
            -x '*.test.mjs' -x 'alltests.mjs' -x 'package.json' -x 'package-lock.json' \
            -x 'node_modules/*')
          unzip -l "dist/maspassword-extension-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker image (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-macos, extension, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Release body with direct download links, OSS-style. GitHub appends the
      # auto-generated changelog after this body.
      - name: Compose release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## Descargas"
            echo ""
            echo "| Artefacto | Descarga |"
            echo "|---|---|"
            for f in dist/*; do
              n=$(basename "$f")
              case "$n" in
                *.dmg)           label="App de escritorio macOS (universal: Apple Silicon + Intel)" ;;
                *.app.zip)       label="App macOS como .app (zip)" ;;
                *extension*.zip) label="Extension de Chrome" ;;
                SHA256SUMS.txt)  label="Checksums SHA-256" ;;
                *)               label="$n" ;;
              esac
              echo "| $label | [\`$n\`](${BASE}/${n}) |"
            done
            echo ""
            echo "## Imagen Docker (linux/amd64 + linux/arm64)"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}"
            echo '```'
            echo ""
            echo "## Instalacion rapida"
            echo ""
            echo "- **macOS**: abre el dmg, arrastra MasPassword a Aplicaciones y autoriza el binario sin firmar con \`xattr -cr /Applications/MasPassword.app\`."
            echo "- **Extension**: descomprime el zip y cargalo desde \`chrome://extensions\` (modo desarrollador > Cargar extension sin empaquetar)."
            echo "- **Servidor**: \`JWT_SECRET=\$(openssl rand -hex 32) docker compose up -d\` — instrucciones completas en el [README](https://github.com/${GITHUB_REPOSITORY}#instalacion)."
            echo ""
            echo "Verifica las descargas: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
